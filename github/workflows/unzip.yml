name: Unzip BRMODS ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Unzip BRMODS.zip
        shell: bash
        run: |
          set -e
          test -f BRMODS.zip
          rm -rf BRMODS
          mkdir -p _brmods_extract
          unzip -q BRMODS.zip -d _brmods_extract

          if [ -d "_brmods_extract/BRMODS" ]; then
            cp -a _brmods_extract/BRMODS/. ./
          else
            cp -a _brmods_extract/. ./
          fi

          rm -rf _brmods_extract BRMODS.zip

      - name: Commit extracted files
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unzip BRMODS project"
            git push origin HEAD:main
          fi
          
