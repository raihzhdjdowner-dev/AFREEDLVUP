<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — FreeFire Level Up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #060913;
            --bg-card: rgba(13, 19, 36, 0.85);
            --border-card: rgba(127, 0, 255, 0.25);
            --accent-cyan: #00f2fe;
            --accent-blue: #4facfe;
            --accent-purple: #7f00ff;
            --accent-pink: #ff3366;
            --text-main: #f0f4fc;
            --text-muted: #8e9bb5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(circle at 20% 20%, rgba(127, 0, 255, 0.28) 0%, transparent 45%),
                radial-gradient(circle at 80% 80%, rgba(255, 51, 102, 0.15) 0%, transparent 45%),
                linear-gradient(180deg, #060913 0%, #0a0e1c 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
        }

        .brand-top {
            text-align: center;
            margin-bottom: 32px;
        }

        .brand-logo {
            width: 72px;
            height: 72px;
            margin: 0 auto 16px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #fff;
            box-shadow: 0 0 30px rgba(127, 0, 255, 0.55);
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 20px rgba(127, 0, 255, 0.4); }
            100% { box-shadow: 0 0 40px rgba(255, 51, 102, 0.6); }
        }

        .brand-top h1 {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .brand-top p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 22px;
            padding: 32px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 40px rgba(127, 0, 255, 0.15);
        }

        .login-card h2 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .login-card h2 i {
            color: #c084fc;
        }

        .login-card .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 7px;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i.icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 15px;
            pointer-events: none;
        }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 14px 12px 42px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s;
        }

        .form-input:focus {
            border-color: #c084fc;
            box-shadow: 0 0 0 3px rgba(127, 0, 255, 0.18);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
            border: none;
            outline: none;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: #fff;
            box-shadow: 0 4px 16px rgba(127, 0, 255, 0.35);
            margin-top: 6px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(127, 0, 255, 0.55);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            margin-top: 14px;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        .alert {
            padding: 11px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }

        .alert.show { display: block; }

        .alert-error {
            background: rgba(255, 51, 102, 0.12);
            border: 1px solid rgba(255, 51, 102, 0.35);
            color: #ff8099;
        }

        .alert-success {
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid rgba(0, 255, 136, 0.35);
            color: #66ffb8;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .warning-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 51, 102, 0.08);
            border: 1px solid rgba(255, 51, 102, 0.25);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px;
            color: #ff8099;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="brand-top">
            <div class="brand-logo"><i class="fa-solid fa-shield-halved"></i></div>
            <h1>ADMIN ACCESS</h1>
            <p>Restricted area — Authorized personnel only</p>
        </div>

        <div class="login-card">
            <h2><i class="fa-solid fa-crown"></i> Admin Login</h2>
            <p class="subtitle">Enter admin credentials to continue</p>

            <div class="warning-badge">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>This is a secure admin-only area</span>
            </div>

            <div class="alert alert-error" id="alert-box"></div>

            <form id="admin-login-form" onsubmit="submitAdminLogin(event)">
                <div class="form-group">
                    <label>Admin Username</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user-shield icon"></i>
                        <input type="text" class="form-input" id="admin-username"
                               placeholder="Enter admin username" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Admin Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-key icon"></i>
                        <input type="password" class="form-input" id="admin-password"
                               placeholder="Enter admin password" autocomplete="current-password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" id="submit-btn">
                    <i class="fa-solid fa-unlock-keyhole"></i>
                    <span>Access Admin Panel</span>
                </button>
            </form>

            <button class="btn btn-back" onclick="goBack()">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to User Login</span>
            </button>
        </div>
    </div>

    <script>
        function showAlert(msg, type = 'error') {
            const box = document.getElementById('alert-box');
            box.className = 'alert alert-' + type + ' show';
            box.innerText = msg;
        }

        function hideAlert() {
            document.getElementById('alert-box').classList.remove('show');
        }

        async function submitAdminLogin(e) {
            e.preventDefault();
            hideAlert();

            const username = document.getElementById('admin-username').value.trim();
            const password = document.getElementById('admin-password').value.trim();
            const btn = document.getElementById('submit-btn');
            const originalHtml = btn.innerHTML;

            if (!username || !password) {
                showAlert('Please enter admin credentials', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span><span>Verifying...</span>';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.status === 'ok') {
                    showAlert('Access granted! Redirecting...', 'success');
                    setTimeout(() => { window.location.href = '/admin'; }, 500);
                } else {
                    showAlert(data.error || 'Access denied', 'error');
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            } catch (err) {
                showAlert('Connection error: ' + err.message, 'error');
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        }

        function goBack() {
            window.location.href = '/login';
        }
    </script>
</body>
</html>
