<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — AFREED DEVELOPER LV UP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #05070d;
            --bg-card: #0a1018;
            --bg-card-2: #0e1520;
            --border-card: rgba(255, 255, 255, 0.07);
            --accent-cyan: #38bdf8;
            --accent-blue: #3b82f6;
            --accent-green: #10b981;
            --accent-amber: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #a78bfa;
            --text-main: #e8eef7;
            --text-muted: #7a8799;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            background-image:
                radial-gradient(ellipse at 15% -10%, rgba(56, 189, 248, 0.08) 0%, transparent 55%),
                radial-gradient(ellipse at 85% 110%, rgba(139, 92, 246, 0.06) 0%, transparent 55%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 16px;
            font-size: 15px;
        }

        .container { max-width: 720px; margin: 0 auto; }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 18px;
            background: linear-gradient(180deg, #0b121c 0%, #080d16 100%);
            border: 1px solid var(--border-card);
            border-radius: 18px;
            margin-bottom: 14px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .logo-box {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px; color: #fff;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35);
            flex-shrink: 0;
        }

        .brand-text h1 {
            font-size: 15px; font-weight: 800;
            letter-spacing: -0.2px; color: #fff; line-height: 1.1;
        }

        .brand-text p {
            font-size: 10.5px; color: var(--text-muted);
            margin-top: 2px; font-weight: 500;
        }

        .header-right { display: flex; align-items: center; gap: 8px; }

        .user-chip {
            display: flex; align-items: center; gap: 6px;
            background: rgba(56, 189, 248, 0.08);
            border: 1px solid rgba(56, 189, 248, 0.22);
            border-radius: 10px; padding: 7px 11px;
            font-size: 11.5px; font-weight: 700;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
        }

        .countdown-chip {
            display: flex; align-items: center; gap: 6px;
            background: rgba(245, 158, 11, 0.08);
            border: 1px solid rgba(245, 158, 11, 0.25);
            border-radius: 10px; padding: 7px 11px;
            font-size: 11.5px; font-weight: 700;
            color: var(--accent-amber);
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s;
        }

        .countdown-chip.danger {
            background: rgba(239, 68, 68, 0.1);
            border-color: rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px; padding: 8px 13px; border-radius: 10px;
            font-size: 12.5px; font-weight: 700;
            cursor: pointer; transition: all 0.2s ease;
            border: none; outline: none; white-space: nowrap;
        }

        .btn:active { transform: scale(0.97); }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8, #3b82f6);
            color: #04080f;
            box-shadow: 0 3px 12px rgba(56, 189, 248, 0.28);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
        }

        .btn-ghost:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.07);
            color: var(--text-main);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-ghost:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-pause {
            background: rgba(245, 158, 11, 0.10);
            border: 1px solid rgba(245, 158, 11, 0.30);
            color: #fbbf24;
        }
        .btn-pause:hover { background: rgba(245, 158, 11, 0.18); }

        .btn-restart {
            background: rgba(59, 130, 246, 0.10);
            border: 1px solid rgba(59, 130, 246, 0.30);
            color: #60a5fa;
        }
        .btn-restart:hover { background: rgba(59, 130, 246, 0.18); }

        .info-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px; margin-bottom: 14px;
        }

        .info-item {
            background: linear-gradient(180deg, #0b121c 0%, #080d16 100%);
            border: 1px solid var(--border-card);
            border-radius: 14px; padding: 12px 13px;
            display: flex; align-items: center; gap: 10px;
            min-width: 0;
        }

        .info-item-icon {
            width: 34px; height: 34px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; flex-shrink: 0;
        }

        .info-item-icon.cyan { background: rgba(56, 189, 248, 0.12); color: var(--accent-cyan); }
        .info-item-icon.green { background: rgba(16, 185, 129, 0.12); color: var(--accent-green); }
        .info-item-icon.purple { background: rgba(167, 139, 250, 0.12); color: var(--accent-purple); }

        .info-item-content {
            display: flex; flex-direction: column; gap: 2px;
            min-width: 0; overflow: hidden;
        }

        .info-item-content h3 {
            font-size: 16px; font-weight: 800; color: #fff;
            font-family: 'JetBrains Mono', monospace;
            letter-spacing: -0.3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .info-item-content p {
            font-size: 9.5px; color: var(--text-muted);
            font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.4px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .add-section {
            background: linear-gradient(180deg, #0b121c 0%, #080d16 100%);
            border: 1px solid var(--border-card);
            border-radius: 16px; padding: 16px; margin-bottom: 14px;
        }

        .section-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
        }

        .section-head h3 {
            font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            color: #fff;
        }

        .section-head h3 i { color: var(--accent-cyan); }

        .toggle-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-card);
            color: var(--text-muted);
            padding: 6px 11px; border-radius: 8px;
            font-size: 11.5px; font-weight: 700;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
        }

        .toggle-btn:hover {
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-cyan);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .add-form-body {
            display: none; margin-top: 14px; padding-top: 14px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .add-form-body.open {
            display: block;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-stack { display: flex; flex-direction: column; gap: 10px; }

        .form-row-2 {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
        }

        @media (max-width: 520px) {
            .form-row-2 { grid-template-columns: 1fr; }
        }

        .form-group label {
            display: block; font-size: 10px; font-weight: 800;
            color: var(--text-muted); margin-bottom: 5px;
            text-transform: uppercase; letter-spacing: 0.6px;
        }

        .form-input, .form-select {
            width: 100%; background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px; padding: 10px 13px;
            color: #fff; font-size: 13.5px; outline: none;
            transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 500;
        }

        .form-input::placeholder { color: #4b5563; font-weight: 400; }

        .form-input:focus, .form-select:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
            background: rgba(0, 0, 0, 0.45);
        }

        .form-select option { background: #0b121c; color: #fff; }

        .alert {
            padding: 10px 13px; border-radius: 10px;
            font-size: 12.5px; font-weight: 600;
            margin-bottom: 12px; display: none;
            align-items: center; gap: 8px;
        }

        .alert.show { display: flex; }

        .alert-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #6ee7b7;
        }

        .accounts-list { display: flex; flex-direction: column; gap: 14px; }

        .account-card {
            background: linear-gradient(180deg, #0b121c 0%, #080d16 100%);
            border: 1px solid var(--border-card);
            border-radius: 20px; padding: 20px;
            transition: all 0.25s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            position: relative; overflow: hidden;
        }

        .account-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(56, 189, 248, 0.5), transparent);
            opacity: 0; transition: opacity 0.3s;
        }

        .account-card:hover {
            border-color: rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .account-card:hover::before { opacity: 1; }

        .acc-status {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700;
            padding: 5px 11px; border-radius: 20px;
            margin-bottom: 16px; letter-spacing: 0.3px;
        }

        .acc-status.in-match {
            background: rgba(245, 158, 11, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.28);
        }

        .acc-status.online {
            background: rgba(16, 185, 129, 0.12);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.28);
        }

        .acc-status.searching {
            background: rgba(56, 189, 248, 0.12);
            color: var(--accent-cyan);
            border: 1px solid rgba(56, 189, 248, 0.28);
        }

        .acc-status.offline {
            background: rgba(122, 135, 153, 0.1);
            color: var(--text-muted);
            border: 1px solid rgba(122, 135, 153, 0.22);
        }

        .acc-status.br-ranked {
            background: rgba(168, 85, 247, 0.14);
            color: #d8b4fe;
            border: 1px solid rgba(168, 85, 247, 0.35);
        }

        .acc-status.error {
            background: rgba(239, 68, 68, 0.12);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.28);
        }

        .status-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
            animation: pulse-status 1.8s infinite;
        }

        @keyframes pulse-status {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.45; }
        }

        .acc-head {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; margin-bottom: 18px; padding-bottom: 18px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .acc-profile {
            display: flex; align-items: center; gap: 14px;
            min-width: 0; flex: 1;
        }

        .acc-avatar {
            width: 56px; height: 56px; border-radius: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #38bdf8 100%);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 22px; color: #fff;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3);
            text-transform: uppercase; letter-spacing: -1px;
        }

        .acc-name { min-width: 0; flex: 1; }

        .acc-name h4 {
            font-size: 18px; font-weight: 800; color: #fff;
            letter-spacing: -0.3px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            line-height: 1.2;
        }

        .acc-name .uid {
            font-size: 12px; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
            margin-top: 4px; font-weight: 500;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        .level-badge {
            display: inline-flex; align-items: center; gap: 4px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.3);
            color: var(--accent-cyan);
            padding: 6px 11px; border-radius: 10px;
            font-size: 12.5px; font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            flex-shrink: 0;
        }

        .acc-details {
            display: flex; flex-direction: column; gap: 10px;
            margin-bottom: 14px;
        }

        .detail-row {
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px;
        }

        .detail-label {
            font-size: 11px; font-weight: 800;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.6px; flex-shrink: 0;
        }

        .detail-value {
            font-size: 13.5px; font-weight: 700;
            color: #fff; font-family: 'JetBrains Mono', monospace;
            text-align: right; overflow: hidden;
            text-overflow: ellipsis; white-space: nowrap;
            min-width: 0;
        }

        .updated-line {
            display: flex; align-items: center; gap: 7px;
            font-size: 11.5px; color: var(--text-muted);
            margin: 14px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        .updated-line i {
            font-size: 6px; color: var(--accent-green);
            filter: drop-shadow(0 0 4px currentColor);
        }

        .level-progress { margin-bottom: 16px; }

        .level-labels {
            display: flex; justify-content: space-between;
            font-size: 13px; margin-bottom: 8px;
            font-weight: 700;
        }

        .level-labels .lvl { color: var(--accent-cyan); }
        .level-labels .matches {
            color: var(--text-muted); font-weight: 600; font-size: 12px;
        }

        .progress-bar-bg {
            height: 8px; background: rgba(255, 255, 255, 0.05);
            border-radius: 10px; overflow: hidden; position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #38bdf8, #10b981);
            border-radius: 10px;
            transition: width 0.6s ease;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .exp-row {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            gap: 10px; margin-bottom: 16px;
        }

        .exp-box {
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px; padding: 14px 8px;
            text-align: center; transition: all 0.25s;
        }

        .exp-box:hover {
            border-color: rgba(56, 189, 248, 0.2);
            transform: translateY(-2px);
        }

        .exp-box i {
            font-size: 14px; margin-bottom: 8px; display: block;
        }

        .exp-box.initial i { color: var(--accent-cyan); }
        .exp-box.current i { color: #60a5fa; }
        .exp-box.gained i { color: var(--accent-green); }

        .exp-box .exp-label {
            font-size: 9.5px; color: var(--text-muted);
            text-transform: uppercase; font-weight: 800;
            letter-spacing: 0.6px; margin-bottom: 8px;
            line-height: 1.2;
        }

        .exp-box .exp-value {
            font-size: 18px; font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
            color: #fff; letter-spacing: -0.5px; line-height: 1;
        }

        .exp-box.gained .exp-value {
            color: var(--accent-green);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.35);
        }

        .acc-actions {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }

        .acc-actions .btn {
            padding: 12px; font-size: 13px;
            font-weight: 800; letter-spacing: 0.5px;
            text-transform: uppercase; border-radius: 12px;
        }

        .empty-state {
            text-align: center; padding: 60px 20px;
            background: linear-gradient(180deg, #0b121c 0%, #080d16 100%);
            border: 1px dashed rgba(255, 255, 255, 0.1);
            border-radius: 20px; color: var(--text-muted);
        }

        .empty-state i {
            font-size: 42px; margin-bottom: 14px;
            color: rgba(255, 255, 255, 0.08); display: block;
        }

        .empty-state h3 {
            font-size: 16px; color: var(--text-main);
            margin-bottom: 6px; font-weight: 700;
        }

        .empty-state p { font-size: 13px; }

        .loading {
            text-align: center; padding: 50px 20px;
            color: var(--text-muted); font-size: 13.5px;
        }

        .loading i {
            font-size: 26px; color: var(--accent-cyan);
            margin-bottom: 12px; display: block;
        }

        @media (max-width: 520px) {
            body { padding: 12px; }
            .info-bar { grid-template-columns: 1fr 1fr; }
            .info-bar .info-item:nth-child(3) { grid-column: span 2; }
            .acc-avatar { width: 50px; height: 50px; font-size: 20px; border-radius: 14px; }
            .acc-name h4 { font-size: 16px; }
            .exp-box .exp-value { font-size: 15px; }
            .exp-box .exp-label { font-size: 8.5px; }
            .account-card { padding: 16px; border-radius: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="brand">
                <div class="logo-box"><i class="fa-solid fa-bolt"></i></div>
                <div class="brand-text">
                    <h1>AFREED DEVELOPER LV UP</h1>
                    <p>Automated EXP Farming</p>
                </div>
            </div>
            <div class="header-right">
                <div class="user-chip">
                    <i class="fa-solid fa-user"></i>
                    <span id="chip-username">--</span>
                </div>
                <div class="countdown-chip" id="chip-countdown">
                    <i class="fa-solid fa-clock"></i>
                    <span id="countdown-text">--:--:--</span>
                </div>
                <button class="btn btn-danger" onclick="logout()" title="Logout">
                    <i class="fa-solid fa-right-from-bracket"></i>
                </button>
            </div>
        </header>

        <div class="info-bar">
            <div class="info-item">
                <div class="info-item-icon cyan"><i class="fa-solid fa-users"></i></div>
                <div class="info-item-content">
                    <h3><span id="info-used">0</span>/<span id="info-limit">0</span></h3>
                    <p>Accounts</p>
                </div>
            </div>
            <div class="info-item">
                <div class="info-item-icon green"><i class="fa-solid fa-angles-up"></i></div>
                <div class="info-item-content">
                    <h3 id="info-total-exp">+0</h3>
                    <p>Total EXP</p>
                </div>
            </div>
            <div class="info-item">
                <div class="info-item-icon purple"><i class="fa-solid fa-gamepad"></i></div>
                <div class="info-item-content">
                    <h3 id="info-total-matches">0</h3>
                    <p>Matches</p>
                </div>
            </div>
        </div>

        <div class="add-section">
            <div class="section-head">
                <h3><i class="fa-solid fa-plus-circle"></i> Add New Account</h3>
                <button class="toggle-btn" onclick="toggleAddForm()" id="toggle-btn">
                    <i class="fa-solid fa-chevron-down"></i> Open
                </button>
            </div>

            <div class="alert alert-error" id="add-alert"></div>

            <div class="add-form-body" id="add-form-body">
                <form id="add-account-form" onsubmit="submitAddAccount(event)">
                    <div class="form-stack">
                        <div class="form-group">
                            <label>Account Type</label>
                            <select class="form-select" id="acc-type" onchange="toggleFormType()">
                                <option value="guest">UID + Password</option>
                                <option value="token">Access Token</option>
                            </select>
                            <p style="margin:8px 0 0;color:#94a3b8;font-size:12px;">Level 2 accounts only work with UID and password.</p>
                        </div>

                        <div class="form-row-2" id="guest-fields">
                            <div class="form-group">
                                <label>UID</label>
                                <input type="text" class="form-input" id="acc-uid" placeholder="Free Fire UID">
                            </div>
                            <div class="form-group">
                                <label>Password</label>
                                <input type="text" class="form-input" id="acc-password" placeholder="Password">
                            </div>
                        </div>

                        <div class="form-group" id="token-field" style="display:none;">
                            <label>Access Token</label>
                            <input type="text" class="form-input" id="acc-token" placeholder="Paste access token here">
                        </div>

                        <button type="submit" class="btn btn-primary" style="padding: 12px;">
                            <i class="fa-solid fa-plus"></i> Add Account
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div style="display:flex;justify-content:flex-end;margin:0 0 10px;">
            <button class="btn btn-pause" type="button" onclick="pauseAllAccounts()" style="padding:10px 14px;">
                <i class="fa-solid fa-pause"></i> Pause / Resume All
            </button>
        </div>

        <div class="accounts-list" id="accounts-container">
            <div class="loading">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                Loading accounts...
            </div>
        </div>
    </div>

    <script>
        let userData = null;
        let countdownTimer = null;

        // Per-card refresh cooldown tracking (30 seconds)
        const refreshCooldowns = {};
        const REFRESH_COOLDOWN_MS = 30 * 1000; // 30 seconds
        const AUTO_REFRESH_INTERVAL_MS = 5 * 60 * 1000; // 5 minutes

        function showAlert(msg, type = 'error') {
            const box = document.getElementById('add-alert');
            box.className = 'alert alert-' + type + ' show';
            box.innerHTML = '<i class="fa-solid fa-' + (type === 'success' ? 'check-circle' : 'exclamation-circle') + '"></i><span>' + msg + '</span>';
            if (type === 'success') {
                setTimeout(() => box.classList.remove('show'), 3000);
            }
        }

        function hideAlert() {
            document.getElementById('add-alert').classList.remove('show');
        }

        function toggleAddForm() {
            const body = document.getElementById('add-form-body');
            const btn = document.getElementById('toggle-btn');
            body.classList.toggle('open');
            if (body.classList.contains('open')) {
                btn.innerHTML = '<i class="fa-solid fa-chevron-up"></i> Close';
            } else {
                btn.innerHTML = '<i class="fa-solid fa-chevron-down"></i> Open';
            }
        }

        function toggleFormType() {
            const type = document.getElementById('acc-type').value;
            const guestF = document.getElementById('guest-fields');
            const tokF = document.getElementById('token-field');

            if (type === 'guest') {
                guestF.style.display = 'grid';
                tokF.style.display = 'none';
            } else {
                guestF.style.display = 'none';
                tokF.style.display = 'block';
            }
        }

        async function submitAddAccount(e) {
            e.preventDefault();
            hideAlert();

            const type = document.getElementById('acc-type').value;
            let payload = {};

            if (type === 'guest') {
                const uid = document.getElementById('acc-uid').value.trim();
                const password = document.getElementById('acc-password').value.trim();
                if (!uid || !password) {
                    showAlert('Please enter UID and Password');
                    return;
                }
                payload = { uid, password };
            } else {
                const token = document.getElementById('acc-token').value.trim();
                if (!token) {
                    showAlert('Please enter access token');
                    return;
                }
                payload = { token };
            }

            try {
                const res = await fetch('/api/user/add-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    showAlert('Account added successfully!', 'success');
                    document.getElementById('add-account-form').reset();
                    toggleFormType();
                    loadStats();
                } else {
                    showAlert(data.error || 'Failed to add account');
                }
            } catch (err) {
                showAlert('Error: ' + err.message);
            }
        }

        async function removeAccount(accountId) {
            if (!confirm('Remove this account? The bot will stop for it.')) return;
            try {
                const res = await fetch('/api/user/remove-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ account_id: accountId })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    delete refreshCooldowns[accountId];
                    showAlert('Account deleted and runtime stopped.', 'success');
                    loadStats();
                } else {
                    alert('Error: ' + (data.error || 'Unknown'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            }
        }

        async function pauseAccount(accountId) {
            try {
                const res = await fetch('/api/user/pause-account', {
                    method: 'POST', headers: {'Content-Type':'application/json'}, credentials:'same-origin',
                    body: JSON.stringify({account_id: accountId})
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    showAlert(data.is_paused ? 'Account paused — live runtime stopped.' : 'Account resumed.', 'success');
                    loadStats();
                } else {
                    showAlert(data.error || 'Pause failed');
                }
            } catch (e) { showAlert('Pause error: ' + e.message); }
        }

        async function restartAccount(accountId) {
            if (!confirm('Restart this account runtime?')) return;
            try {
                const res = await fetch('/api/user/restart-account', {
                    method: 'POST', headers: {'Content-Type':'application/json'}, credentials:'same-origin',
                    body: JSON.stringify({account_id: accountId})
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    showAlert('Account runtime restarted.', 'success');
                    setTimeout(loadStats, 1200);
                } else {
                    showAlert(data.error || 'Restart failed');
                }
            } catch (e) { showAlert('Restart error: ' + e.message); }
        }

        async function pauseAllAccounts() {
            try {
                const res = await fetch('/api/user/pause-all', {method:'POST', credentials:'same-origin'});
                const data = await res.json();
                if (data.status === 'ok') {
                    showAlert(data.all_paused ? 'All accounts paused.' : 'All accounts resumed.', 'success');
                    loadStats();
                } else showAlert(data.error || 'Pause all failed');
            } catch (e) { showAlert('Pause all error: ' + e.message); }
        }

        // ============ SINGLE CARD REFRESH (30s COOLDOWN, NO SUCCESS MSG) ============
        async function refreshAccount(accountId) {
            const now = Date.now();
            const lastRefresh = refreshCooldowns[accountId] || 0;
            const elapsed = now - lastRefresh;

            if (elapsed < REFRESH_COOLDOWN_MS) {
                return; // Still on cooldown — silently ignore
            }

            // Find the specific card and its refresh button
            const cards = document.querySelectorAll('.account-card');
            let targetCard = null;
            let targetBtn = null;

            for (const card of cards) {
                const uidEl = card.querySelector('.acc-name .uid');
                if (uidEl && uidEl.innerText.includes(accountId)) {
                    targetCard = card;
                    targetBtn = card.querySelector('.btn-refresh');
                    break;
                }
            }

            if (targetBtn) {
                targetBtn.disabled = true;
                targetBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Loading...';
            }

            // Mark cooldown immediately
            refreshCooldowns[accountId] = Date.now();

            try {
                const res = await fetch('/api/user/refresh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ account_id: accountId })
                });
                const data = await res.json();

                if (data.status === 'ok' && data.account) {
                    // Update ONLY this specific card — no success message
                    updateSingleAccountCard(targetCard, data.account);
                } else {
                    // On failure, reset cooldown
                    delete refreshCooldowns[accountId];
                }
            } catch (err) {
                console.error('Refresh error:', err);
                delete refreshCooldowns[accountId];
            } finally {
                if (targetBtn) {
                    startRefreshCooldownTimer(targetBtn, accountId);
                }
            }
        }

        function startRefreshCooldownTimer(btn, accountId) {
            const startTime = refreshCooldowns[accountId] || Date.now();
            const updateBtn = () => {
                const elapsed = Date.now() - startTime;
                const remaining = REFRESH_COOLDOWN_MS - elapsed;

                if (remaining <= 0) {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-rotate"></i> Refresh';
                    delete refreshCooldowns[accountId];
                    return;
                }

                const secs = Math.ceil(remaining / 1000);
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-clock"></i> ' + secs + 's';

                setTimeout(updateBtn, 1000);
            };
            updateBtn();
        }

        // Update a single card in-place WITHOUT re-rendering everything
        function updateSingleAccountCard(cardEl, account) {
            if (!cardEl) return;

            const st = statusInfo(account);

            const statusEl = cardEl.querySelector('.acc-status');
            if (statusEl) {
                statusEl.className = 'acc-status ' + st.cls;
                statusEl.innerHTML = '<span class="status-dot"></span><span>' + st.text + '</span>';
            }

            const lvlBadge = cardEl.querySelector('.level-badge');
            if (lvlBadge) lvlBadge.innerText = 'Lv. ' + (account.level || 1);

            const nickEl = cardEl.querySelector('.acc-name h4');
            if (nickEl) nickEl.innerText = account.nickname || 'Unknown';

            const avEl = cardEl.querySelector('.acc-avatar');
            if (avEl) avEl.innerText = getInitial(account.nickname, account.uid);

            const detailValues = cardEl.querySelectorAll('.detail-value');
            if (detailValues.length >= 4) {
                detailValues[0].innerText = account.added_at ? timeAgo(account.added_at) : 'Just now';
                detailValues[1].innerText = account.matches_played || 0;
                detailValues[2].innerText = account.nickname || '--';
                detailValues[3].innerText = account.region || 'BD';
            }

            const updatedEl = cardEl.querySelector('.updated-line span');
            if (updatedEl) updatedEl.innerText = 'Updated at ' + (account.last_updated || '--');

            const lvlLabel = cardEl.querySelector('.level-labels .lvl');
            if (lvlLabel) {
                const onBr = String(account.status || '').indexOf('BR_') === 0 || account.status === 'LEVEL_UP';
                lvlLabel.innerText = onBr ? 'Battle Royale' : ('Level ' + (account.level || 1));
            }
            const matchLabel = cardEl.querySelector('.level-labels .matches');
            if (matchLabel) matchLabel.innerText = 'Matches: ' + (account.matches_played || 0);

            const lvl = Math.max(1, Math.min(21, account.level || 1));
            const progress = Math.min(100, (lvl / 21) * 100);
            const barEl = cardEl.querySelector('.progress-bar-fill');
            if (barEl) barEl.style.width = progress + '%';

            const expVals = cardEl.querySelectorAll('.exp-value');
            if (expVals.length >= 3) {
                expVals[0].innerText = (account.initial_exp || 0).toLocaleString();
                expVals[1].innerText = (account.current_exp || 0).toLocaleString();
                expVals[2].innerText = '+' + (account.gained_exp || 0).toLocaleString();
            }

            // Brief flash highlight (visual feedback only, no text msg)
            cardEl.style.transition = 'none';
            cardEl.style.boxShadow = '0 0 25px rgba(56, 189, 248, 0.7)';
            cardEl.style.borderColor = 'rgba(56, 189, 248, 0.6)';
            setTimeout(() => {
                cardEl.style.transition = 'all 0.4s';
                cardEl.style.boxShadow = '';
                cardEl.style.borderColor = '';
            }, 400);
        }

        function formatCountdown(sec) {
            if (sec <= 0) return 'Expired';
            const d = Math.floor(sec / 86400);
            const h = Math.floor((sec % 86400) / 3600);
            const m = Math.floor((sec % 3600) / 60);
            const s = Math.floor(sec % 60);
            if (d > 0) return d + 'd ' + h + 'h';
            if (h > 0) return h + 'h ' + m + 'm';
            if (m > 0) return m + 'm ' + s + 's';
            return s + 's';
        }

        function timeAgo(ts) {
            const now = Date.now() / 1000;
            const diff = Math.max(0, now - ts);
            if (diff < 60) return 'Just now';
            if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
            if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
            return Math.floor(diff / 86400) + 'd ago';
        }

        function tickCountdown() {
            if (!userData) return;
            userData.remaining_seconds = Math.max(0, userData.remaining_seconds - 1);
            const chip = document.getElementById('chip-countdown');
            document.getElementById('countdown-text').innerText = formatCountdown(userData.remaining_seconds);

            if (userData.remaining_seconds < 3600) {
                chip.classList.add('danger');
            } else {
                chip.classList.remove('danger');
            }

            if (userData.remaining_seconds <= 0) {
                alert('Your session has expired. Logging out...');
                window.location.href = '/login?expired=1';
            }
        }

        function statusInfo(acc) {
            if (acc.is_paused || acc.status === 'PAUSED') {
                return { cls: 'offline', text: 'Paused' };
            }
            const s = acc.status || 'ONLINE';
            const br = {
                'BR_CHECKING': 'Checking',
                'BR_SEARCHING': 'Searching',
                'BR_JOINING': 'Joining',
                'BR_LOBBY': 'Starting',
                'BR_PLANE': 'On Plane',
                'BR_FLYING': 'Flying',
                'BR_LANDED': 'Playing',
                'BR_ELIMINATED': 'Eliminated',
                'LEVEL_UP': 'Starting'
            };
            if (br[s]) {
                return { cls: 'br-ranked', text: 'Battle Royale · ' + br[s] };
            }
            const map = {
                'IN_MATCH': { cls: 'in-match', text: 'In Match (' + (acc.active_matches || 0) + ')' },
                'ONLINE': { cls: 'online', text: 'Online' },
                'SEARCHING': { cls: 'searching', text: 'Searching...' },
                'CONNECTING': { cls: 'searching', text: 'Connecting...' },
                'NEED_UID': { cls: 'error', text: 'Level 2 needs UID + Password' },
                'NEED_BD': { cls: 'error', text: 'Level up supports BD only' },
                'ERROR': { cls: 'error', text: 'Error' },
                'OFFLINE': { cls: 'offline', text: 'Offline' }
            };
            return map[s] || { cls: 'online', text: s };
        }

        function getInitial(nickname, uid) {
            if (nickname) {
                const cleaned = String(nickname).replace(/[^\x20-\x7E]/g, '').trim();
                if (cleaned.length > 0) {
                    return cleaned[0].toUpperCase();
                }
            }
            if (uid) {
                return String(uid).slice(-1);
            }
            return '?';
        }

        function renderAccount(acc) {
            const st = statusInfo(acc);
            const initial = getInitial(acc.nickname, acc.uid);
            const gained = acc.gained_exp || 0;
            const created = acc.added_at ? timeAgo(acc.added_at) : 'Just now';
            const displayUid = acc.actual_uid || acc.uid || '--';

            const lvl = Math.max(1, Math.min(21, acc.level || 1));
            const progress = Math.min(100, (lvl / 21) * 100);

            const nicknameSafe = escapeHtml(acc.nickname || 'Unknown');
            const uidSafe = escapeHtml(displayUid);
            const regionSafe = escapeHtml(acc.region || 'BD');
            const lastUpdatedSafe = escapeHtml(acc.last_updated || '--');

            return `
                <div class="account-card" data-uid="${uidSafe}">
                    <div class="acc-status ${st.cls}">
                        <span class="status-dot"></span>
                        <span>${st.text}</span>
                    </div>

                    <div class="acc-head">
                        <div class="acc-profile">
                            <div class="acc-avatar">${escapeHtml(initial)}</div>
                            <div class="acc-name">
                                <h4>${nicknameSafe}</h4>
                                <div class="uid">UID: ${uidSafe}</div>
                            </div>
                        </div>
                        <div class="level-badge">Lv. ${acc.level || 1}</div>
                    </div>

                    <div class="acc-details">
                        <div class="detail-row">
                            <span class="detail-label">Created</span>
                            <span class="detail-value">${created}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Played</span>
                            <span class="detail-value">${acc.matches_played || 0}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Nickname</span>
                            <span class="detail-value">${nicknameSafe}</span>
                        </div>
                        <div class="detail-row">
                            <span class="detail-label">Region</span>
                            <span class="detail-value">${regionSafe}</span>
                        </div>
                    </div>

                    <div class="updated-line">
                        <i class="fa-solid fa-circle"></i>
                        <span>Updated at ${lastUpdatedSafe}</span>
                    </div>

                    <div class="level-progress">
                        <div class="level-labels">
                            <span class="lvl">${(String(acc.status || '').indexOf('BR_') === 0 || acc.status === 'LEVEL_UP') ? 'Battle Royale' : ('Level ' + (acc.level || 1))}</span>
                            <span class="matches">Matches: ${acc.matches_played || 0}</span>
                        </div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width:${progress}%"></div>
                        </div>
                    </div>

                    <div class="exp-row">
                        <div class="exp-box initial">
                            <i class="fa-solid fa-flag"></i>
                            <div class="exp-label">Initial EXP</div>
                            <div class="exp-value">${(acc.initial_exp || 0).toLocaleString()}</div>
                        </div>
                        <div class="exp-box current">
                            <i class="fa-solid fa-bolt"></i>
                            <div class="exp-label">Current EXP</div>
                            <div class="exp-value">${(acc.current_exp || 0).toLocaleString()}</div>
                        </div>
                        <div class="exp-box gained">
                            <i class="fa-solid fa-arrow-trend-up"></i>
                            <div class="exp-label">EXP Gained</div>
                            <div class="exp-value">+${gained.toLocaleString()}</div>
                        </div>
                    </div>

                    <div class="acc-actions">
                        <button class="btn btn-ghost btn-refresh" onclick="refreshAccount('${uidSafe}')">
                            <i class="fa-solid fa-rotate"></i> Refresh
                        </button>
                        <button class="btn btn-pause" onclick="pauseAccount('${uidSafe}')">
                            <i class="fa-solid fa-pause"></i> ${acc.is_paused || acc.status === 'PAUSED' ? 'Resume' : 'Pause'}
                        </button>
                        <button class="btn btn-restart" onclick="restartAccount('${uidSafe}')">
                            <i class="fa-solid fa-power-off"></i> Restart
                        </button>
                        <button class="btn btn-danger" onclick="removeAccount('${uidSafe}')">
                            <i class="fa-solid fa-trash"></i> Delete
                        </button>
                    </div>
                </div>
            `;
        }

        async function loadStats() {
            try {
                const res = await fetch('/api/user/stats', { credentials: 'same-origin' });
                if (res.status === 401) {
                    window.location.href = '/login';
                    return;
                }
                const data = await res.json();
                if (data.status !== 'ok') {
                    if (data.error && data.error.toLowerCase().includes('expired')) {
                        window.location.href = '/login?expired=1';
                    }
                    return;
                }

                userData = data;

                document.getElementById('chip-username').innerText = data.username;
                document.getElementById('info-used').innerText = data.accounts_used;
                document.getElementById('info-limit').innerText = data.account_limit;
                document.getElementById('info-total-exp').innerText = '+' + (data.total_gained_exp || 0).toLocaleString();
                document.getElementById('info-total-matches').innerText = data.total_matches || 0;
                document.getElementById('countdown-text').innerText = formatCountdown(data.remaining_seconds);

                const container = document.getElementById('accounts-container');
                const currentCards = container.querySelectorAll('.account-card');
                const hasEmptyState = container.querySelector('.empty-state');

                if (!data.accounts || data.accounts.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-ghost"></i>
                            <h3>No accounts added yet</h3>
                            <p>Click "Add New Account" above to start!</p>
                        </div>
                    `;
                } else if (currentCards.length !== data.accounts.length || hasEmptyState) {
                    // Structure changed — full re-render
                    container.innerHTML = data.accounts.map(renderAccount).join('');
                } else {
                    // Same count — update each card in place (preserves cooldown timers)
                    const cards = container.querySelectorAll('.account-card');
                    data.accounts.forEach((acc, i) => {
                        if (cards[i]) {
                            updateSingleAccountCardSilent(cards[i], acc);
                        }
                    });
                }
            } catch (err) {
                console.error('loadStats error:', err);
            }
        }

        // Silent update (no flash) — used by loadStats auto-poll
        function updateSingleAccountCardSilent(cardEl, account) {
            if (!cardEl) return;

            const st = statusInfo(account);

            const statusEl = cardEl.querySelector('.acc-status');
            if (statusEl) {
                statusEl.className = 'acc-status ' + st.cls;
                statusEl.innerHTML = '<span class="status-dot"></span><span>' + st.text + '</span>';
            }

            const lvlBadge = cardEl.querySelector('.level-badge');
            if (lvlBadge) lvlBadge.innerText = 'Lv. ' + (account.level || 1);

            const nickEl = cardEl.querySelector('.acc-name h4');
            if (nickEl) nickEl.innerText = account.nickname || 'Unknown';

            const avEl = cardEl.querySelector('.acc-avatar');
            if (avEl) avEl.innerText = getInitial(account.nickname, account.uid);

            const detailValues = cardEl.querySelectorAll('.detail-value');
            if (detailValues.length >= 4) {
                detailValues[0].innerText = account.added_at ? timeAgo(account.added_at) : 'Just now';
                detailValues[1].innerText = account.matches_played || 0;
                detailValues[2].innerText = account.nickname || '--';
                detailValues[3].innerText = account.region || 'BD';
            }

            const updatedEl = cardEl.querySelector('.updated-line span');
            if (updatedEl) updatedEl.innerText = 'Updated at ' + (account.last_updated || '--');

            const lvlLabel = cardEl.querySelector('.level-labels .lvl');
            if (lvlLabel) {
                const onBr = String(account.status || '').indexOf('BR_') === 0 || account.status === 'LEVEL_UP';
                lvlLabel.innerText = onBr ? 'Battle Royale' : ('Level ' + (account.level || 1));
            }
            const matchLabel = cardEl.querySelector('.level-labels .matches');
            if (matchLabel) matchLabel.innerText = 'Matches: ' + (account.matches_played || 0);

            const lvl = Math.max(1, Math.min(21, account.level || 1));
            const progress = Math.min(100, (lvl / 21) * 100);
            const barEl = cardEl.querySelector('.progress-bar-fill');
            if (barEl) barEl.style.width = progress + '%';

            const expVals = cardEl.querySelectorAll('.exp-value');
            if (expVals.length >= 3) {
                expVals[0].innerText = (account.initial_exp || 0).toLocaleString();
                expVals[1].innerText = (account.current_exp || 0).toLocaleString();
                expVals[2].innerText = '+' + (account.gained_exp || 0).toLocaleString();
            }
        }

        // ============ AUTO REFRESH ALL (every 5 minutes) ============
        async function autoRefreshAll() {
            try {
                if (!userData || !userData.accounts || userData.accounts.length === 0) {
                    await loadStats();
                    return;
                }

                const uids = userData.accounts
                    .map(a => a.actual_uid || a.uid)
                    .filter(x => x);

                // Fire refresh requests for all accounts in parallel
                await Promise.all(uids.map(uid =>
                    fetch('/api/user/refresh', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'same-origin',
                        body: JSON.stringify({ account_id: uid })
                    }).catch(() => {})
                ));

                // Then reload stats (silent update)
                await loadStats();
            } catch (e) {
                console.error('autoRefresh error:', e);
            }
        }

        async function logout() {
            try {
                await fetch('/api/logout', { method: 'POST', credentials: 'same-origin' });
            } catch (e) {}
            window.location.href = '/login';
        }

        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            return String(text)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============ INIT ============
        loadStats();
        setInterval(loadStats, 4000);                          // Light stats poll every 4s (silent)
        setInterval(autoRefreshAll, AUTO_REFRESH_INTERVAL_MS); // Auto refresh ALL every 5 min
        countdownTimer = setInterval(tickCountdown, 1000);
    </script>
</body>
</html>
