<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>AFREED • Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--bg:#07080e;--p:#0e111b;--p2:#111522;--line:#202536;--text:#f7f8fc;--muted:#8992a8;--pink:#ff2d95;--violet:#8b5cf6;--cyan:#29d8ff;--green:#35e58a;--amber:#ffbd4a;--red:#ff5269}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 0%,#251027 0,transparent 30%),radial-gradient(circle at 100% 0%,#17112d 0,transparent 28%),var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px 16px 38px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.brand{display:flex;gap:11px;align-items:center}.logo{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--pink),var(--violet));box-shadow:0 0 30px #ff2d9535}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-top:3px}.topright{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#ffffff06;color:var(--muted);font-size:10px}.pill b{color:#fff}.btn{border:1px solid var(--line);background:#ffffff07;color:#fff;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:800;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{border-color:#ff2d9555}.primary{border:0;background:linear-gradient(135deg,var(--pink),var(--violet))}.warn{color:var(--amber)}.good{color:var(--green)}.danger{color:var(--red)}.cyan{color:var(--cyan)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat,.panel,.card{background:linear-gradient(180deg,#101521ee,#0b0e16f2);border:1px solid var(--line);box-shadow:0 18px 55px #0005}.stat{border-radius:15px;padding:15px}.stat small{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.stat strong{font:700 25px 'JetBrains Mono';display:block;margin-top:7px}.panel{border-radius:17px;margin-top:12px;overflow:hidden}.head{padding:14px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.head b{font-size:12px}.head span{font-size:9px;color:var(--muted)}.accounts{padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:11px}.card{border-radius:16px;padding:14px;transition:.2s}.card:hover{transform:translateY(-2px);border-color:#ff2d9540}.ctop{display:flex;justify-content:space-between;gap:10px}.who{display:flex;gap:10px;min-width:0}.avatar{width:43px;height:43px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#24304c,#111827);font-weight:800;color:#fff}.name{font-size:13px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.uid{font:9px 'JetBrains Mono';color:var(--muted);margin-top:3px;word-break:break-all}.badge{font:700 8px 'JetBrains Mono';height:max-content;border-radius:999px;padding:5px 8px;color:var(--green);background:#35e58a12;border:1px solid #35e58a30}.badge.c{color:var(--cyan);background:#29d8ff12;border-color:#29d8ff30}.badge.p{color:var(--amber);background:#ffbd4a12;border-color:#ffbd4a30}.meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:13px 0}.m{border:1px solid #ffffff08;background:#0003;border-radius:10px;padding:8px}.m small{display:block;color:var(--muted);font-size:7px;text-transform:uppercase}.m b{display:block;font:700 11px 'JetBrains Mono';margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.progline{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;margin-bottom:5px}.bar{height:6px;background:#191e2b;border-radius:99px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,var(--pink),var(--violet),var(--cyan));border-radius:99px;transition:width .5s}.sub{display:flex;justify-content:space-between;color:var(--muted);font-size:8px;margin-top:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:11px}.actions .btn{padding:9px 4px}.empty{padding:45px 18px;text-align:center;color:var(--muted);font-size:11px}.empty i{font-size:28px;color:var(--violet);display:block;margin-bottom:10px}.tools{display:flex;gap:7px;flex-wrap:wrap}.log{max-height:360px;overflow:auto;padding:8px}.row{display:grid;grid-template-columns:65px 55px 1fr;gap:8px;padding:8px;border-bottom:1px solid #ffffff06;font:9px 'JetBrains Mono'}.ok{color:var(--green)}.er{color:var(--red)}.wa{color:var(--amber)}.in{color:var(--cyan)}.modal{display:none;position:fixed;inset:0;background:#000b;backdrop-filter:blur(10px);z-index:20;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{width:min(460px,100%);background:#0c1019;border:1px solid #ff2d9548;border-radius:18px;padding:18px}.field{margin-top:11px}.field label{display:block;color:var(--muted);font-size:8px;text-transform:uppercase;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#070a10;color:#fff;outline:0}.mf{display:flex;justify-content:flex-end;gap:7px;margin-top:15px}.toast{position:fixed;right:12px;bottom:12px;z-index:30;padding:11px 13px;background:#111725;border:1px solid var(--line);border-radius:11px;font-size:10px}.mobile{display:none}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.accounts{grid-template-columns:1fr}.mobile{display:flex;position:fixed;left:0;right:0;bottom:0;height:58px;background:#080b12f2;border-top:1px solid var(--line);z-index:15}.mobile a{flex:1;color:var(--muted);text-decoration:none;text-align:center;font-size:8px;padding-top:9px}.mobile i{display:block;font-size:15px;margin-bottom:4px}.wrap{padding-bottom:75px}}@media(max-width:500px){.top{align-items:flex-start}.topright{justify-content:flex-end}.pill{display:none}.stats{gap:7px}.stat{padding:11px}.stat strong{font-size:19px}.meta{grid-template-columns:repeat(2,1fr)}.actions{grid-template-columns:repeat(2,1fr)}}
.mode-section{padding:12px;border-top:1px solid #ffffff08}.mode-title{padding:8px 4px 2px;font-weight:800;font-size:12px}.mode-title i{color:var(--cyan);margin-right:6px}.mode-title span{font:8px 'JetBrains Mono';color:var(--muted);margin-left:8px}.mode-section .accounts{padding:10px 0 2px}.mode-section:has(.accounts:empty){display:block}
<style>.maintenance-lock{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(2,3,8,.97);backdrop-filter:blur(12px);text-align:center;pointer-events:auto}.maintenance-lock.show{display:flex}.maintenance-lock .mlbox{max-width:520px;width:100%;padding:42px 26px;border:1px solid #ff336655;border-radius:24px;background:#0b0d15;box-shadow:0 0 70px #ff336622}.maintenance-lock h1{font-size:30px;margin:12px 0}.maintenance-lock p{color:#aab0c0;line-height:1.7}</style></head><body>
<div class="maintenance-lock" id="maintenance-lock"><div class="mlbox"><div style="font-size:54px">🛠️</div><h1 id="maintenance-title-live">UNDER MAINTENANCE</h1><p id="maintenance-message-live">Service is temporarily unavailable.</p></div></div><div class="wrap"><header class="top"><div class="brand"><div class="logo"><i class="fa-solid fa-bolt"></i></div><div><b>AFREED <span style="color:var(--pink)">LV UP</span></b><small>COMMAND CENTER • LIVE</small></div></div><div class="topright"><div class="pill">● ONLINE</div><div class="pill">USER <b id="user">—</b></div><button class="btn primary" onclick="openAdd()"><i class="fa-solid fa-plus"></i>Add Account</button><button class="btn" onclick="sync()"><i class="fa-solid fa-rotate"></i></button></div></header>
<section class="stats"><div class="stat"><small>Accounts</small><strong id="sa">0</strong></div><div class="stat"><small>Total EXP Gained</small><strong id="se" class="" style="color:#ff77ba">+0</strong></div><div class="stat"><small>Matches</small><strong id="sm" style="color:var(--cyan)">0</strong></div><div class="stat"><small>Plan Time</small><strong id="st" style="color:var(--green);font-size:18px">—</strong></div></section>
<section class="panel"><div class="head"><b><i class="fa-solid fa-users" style="color:var(--pink)"></i> Game Accounts</b><div class="tools"><button class="btn warn" onclick="pauseAll()"><i class="fa-solid fa-pause"></i><span id="pa">Pause All</span></button></div></div><div class="mode-section"><div class="mode-title"><i class="fa-solid fa-crosshairs"></i> Battle Royal <span>Existing BR worker</span></div><div class="accounts" id="brCards"></div></div><div class="mode-section"><div class="mode-title"><i class="fa-solid fa-user-ninja"></i> Lone Wolf <span>Separate worker / queue</span></div><div class="accounts" id="lwCards"></div></div></section>
<section class="panel"><div class="head"><b><i class="fa-solid fa-terminal" style="color:var(--cyan)"></i> Live Activity</b><span id="syncAt">—</span></div><div class="log" id="logs"></div></section></div>
<nav class="mobile"><a href="#"><i class="fa-solid fa-grid-2"></i>Home</a><a href="#brCards"><i class="fa-solid fa-crosshairs"></i>Battle Royal</a><a href="#lwCards"><i class="fa-solid fa-user-ninja"></i>Lone Wolf</a><a href="#logs"><i class="fa-solid fa-terminal"></i>Logs</a></nav>
<div class="modal" id="modal"><div class="box"><div style="display:flex;justify-content:space-between;align-items:center"><b>Add Account</b><button class="btn" onclick="closeAdd()">×</button></div><form onsubmit="add(event)"><div class="field"><label>Login Type</label><select id="typ"><option value="guest">UID + Password</option><option value="token">Access Token</option></select></div><div class="field"><label>Game Mode</label><select id="mode"><option value="battle_royal">Battle Royal</option><option value="lone_wolf">Lone Wolf</option></select></div><div id="guest"><div class="field"><label>UID</label><input id="uid"></div><div class="field"><label>Password</label><input id="pw" type="password"></div></div><div id="tok" style="display:none"><div class="field"><label>Access Token</label><textarea id="token" rows="4"></textarea></div></div><div class="mf"><button type="button" class="btn" onclick="closeAdd()">Cancel</button><button class="btn primary">Deploy</button></div></form></div></div><div id="toast"></div>
<script>
const $=x=>document.getElementById(x);let accounts=[];let allPaused=false;
$('typ').onchange=()=>{let t=$('typ').value;$('guest').style.display=t==='guest'?'block':'none';$('tok').style.display=t==='token'?'block':'none'};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(x){return Number(x||0).toLocaleString()}function toast(t){$('toast').textContent=t;setTimeout(()=>$('toast').textContent='',2600)}
async function api(u,o={}){let r=await fetch(u,{cache:'no-store',...o,headers:{'Content-Type':'application/json',...(o.headers||{})}}),d={};try{d=await r.json()}catch{}if(!r.ok||d.status==='error')throw Error(d.error||('HTTP '+r.status));return d}
function timeLeft(s){s=Number(s||0);if(!s)return '—';let d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?`${d}d ${h}h`:h?`${h}h ${m}m`:`${m}m`}
function card(a){let uid=esc(a.uid||a.user_input_uid),name=esc(a.nickname||'Player_'+String(uid).slice(0,6)),lvl=Number(a.level||1),pct=Math.max(0,Math.min(100,Number(a.progress_pct||0))),status=String(a.status||'CONNECTING'),paused=status.startsWith('PAUSED')||a.is_paused;let inMatch=status.startsWith('IN_MATCH');let active=Number(a.active_matches||0);let bc=paused?'p':inMatch?'c':'';return `<article class="card"><div class="ctop"><div class="who"><div class="avatar">${esc(name[0]||'P')}</div><div style="min-width:0"><div class="name">${name}</div><div class="uid">UID ${uid} • ${esc(a.region||'—')}</div></div></div><span class="badge ${bc}">${paused?'PAUSED':inMatch?'IN MATCH • '+active:esc(status)}</span></div><div class="meta"><div class="m"><small>Level</small><b>${lvl}</b></div><div class="m"><small>Current EXP</small><b>${fmt(a.current_exp)}</b></div><div class="m"><small>EXP Gained</small><b style="color:var(--green)">+${fmt(a.gained_exp)}</b></div><div class="m"><small>Matches</small><b>${fmt(a.matches_played)}</b></div><div class="m"><small>Active Now</small><b style="color:var(--cyan)">${fmt(a.active_matches)}</b></div></div><div class="progline"><span>LEVEL PROGRESS</span><span>${pct.toFixed(1)}%</span></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="sub"><span>Likes: ${fmt(a.likes)}</span><span>Updated: ${esc(a.last_updated||'—')}</span></div><div class="actions"><button class="btn ${paused?'good':'warn'}" onclick="pause('${uid}')"><i class="fa-solid ${paused?'fa-play':'fa-pause'}"></i>${paused?'RESUME':'PAUSE'}</button><button class="btn" onclick="refresh('${uid}')"><i class="fa-solid fa-rotate"></i>Sync</button><button class="btn cyan" onclick="restart('${uid}')"><i class="fa-solid fa-power-off"></i>Restart</button><button class="btn danger" onclick="del('${uid}')"><i class="fa-solid fa-trash"></i>Delete</button></div></article>`}
function render(d){accounts=d.accounts||[];$('sa').textContent=fmt(accounts.length);$('se').textContent='+'+fmt(d.total_gained_exp);$('sm').textContent=fmt(d.total_matches);$('st').textContent=timeLeft(d.remaining_seconds);$('user').textContent=d.username||'—';let br=accounts.filter(a=>String(a.mode||'battle_royal')!=='lone_wolf'),lw=accounts.filter(a=>String(a.mode||'battle_royal')==='lone_wolf');$('brCards').innerHTML=br.length?br.map(card).join(''):'<div class="empty">No Battle Royal accounts.</div>';$('lwCards').innerHTML=lw.length?lw.map(card).join(''):'<div class="empty">No Lone Wolf accounts.</div>';if(!accounts.length){$('brCards').innerHTML='<div class="empty"><i class="fa-solid fa-user-plus"></i>No accounts deployed<br><button class="btn primary" onclick="openAdd()" style="margin-top:12px">Add Account</button></div>'}$('logs').innerHTML=(d.logs||[]).slice(-80).reverse().map(l=>`<div class="row"><span style="color:var(--muted)">${esc(l.time||'—')}</span><b class="${l.level==='error'?'er':l.level==='warning'?'wa':l.level==='success'?'ok':'in'}">${esc(String(l.level||'info').toUpperCase())}</b><span>${esc(l.message||'')}</span></div>`).join('')||'<div class="empty">No activity yet.</div>';$('syncAt').textContent='Synced '+new Date().toLocaleTimeString()}
async function sync(){try{render(await api('/api/user/stats'))}catch(e){toast(e.message)}}
async function pause(uid){const btn=[...document.querySelectorAll('.actions .btn')].find(b=>b.getAttribute('onclick')===`pause('${uid}')`);if(btn){btn.disabled=true;btn.dataset.old=btn.innerHTML;btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i>WAIT';}try{let d=await api('/api/account/pause',{method:'POST',body:JSON.stringify({uid})});toast(d.is_paused?'PAUSED • RESUME':'RUNNING • PAUSE');await sync()}catch(e){toast(e.message)}finally{if(btn)btn.disabled=false}}
async function pauseAll(){try{let d=await api('/api/account/pause_all',{method:'POST',body:'{}'});allPaused=!!d.all_paused;$('pa').textContent=allPaused?'Resume All':'Pause All';sync()}catch(e){toast(e.message)}}
async function refresh(uid){try{await api('/api/user/refresh',{method:'POST',body:JSON.stringify({account_id:uid})});toast('Profile sync requested');setTimeout(sync,1200)}catch(e){toast(e.message)}}
async function restart(uid){try{await api('/api/user/restart',{method:'POST',body:JSON.stringify({account_id:uid})});toast('Restart requested');setTimeout(sync,1200)}catch(e){toast(e.message)}}
async function del(uid){if(!confirm('Delete this account? This will stop the account completely.'))return;try{toast('Stopping account…');await api('/api/user/remove-account',{method:'POST',body:JSON.stringify({account_id:uid})});toast('Account deleted • fully stopped');await sync()}catch(e){toast(e.message)}}
function openAdd(){$('modal').classList.add('show')}function closeAdd(){$('modal').classList.remove('show')}async function add(e){e.preventDefault();let t=$('typ').value,mode=$('mode').value,p=t==='guest'?{uid:$('uid').value.trim(),password:$('pw').value,mode}:{token:$('token').value.trim(),mode};try{await api('/api/user/add-account',{method:'POST',body:JSON.stringify(p)});closeAdd();toast('Account added');setTimeout(sync,1000)}catch(x){toast(x.message)}}
async function checkMaintenance(){try{let r=await fetch('/api/public/maintenance',{cache:'no-store'});let d=await r.json();if(d.maintenance){$('maintenance-title-live').textContent=d.title||'UNDER MAINTENANCE';$('maintenance-message-live').textContent=d.message||'';$('maintenance-lock').classList.add('show')}else{$('maintenance-lock').classList.remove('show')}}catch(e){}}checkMaintenance();setInterval(checkMaintenance,2000);sync();setInterval(sync,5000);
</script></body></html>
